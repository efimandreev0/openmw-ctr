# 3DS (CTR) platform settings — these values match applySettingsOverrides()
# in CtrInit.cpp. The code overrides always take precedence at runtime; this
# file provides correct defaults for any setting that might be read before
# overrides apply. Derived from the Vita profile, tuned down for New 3DS
# (ARM11 804MHz, PICA200, ~124MB app memory).

[GUI]
controller menus = true
scaling factor = 0.5
font size = 14

[Input]
enable controller = true
gamepad cursor speed = 0.15
camera sensitivity = 0.4

[Camera]
viewing distance = 1536.0
field of view = 45.0
small feature culling = true
small feature culling pixel size = 10.0
reverse z = false
vita dynamic fog = true

[Terrain]
object paging = false
object paging active grid = false
composite map resolution = 32
lod factor = 12.0
distant terrain = false

[Navigator]
enable = false

[Cells]
preload enabled = false
preload exterior grid = false
preload fast travel = false
preload doors = false
preload instances = false
preload num threads = 1
preload cell cache min = 1
preload cell cache max = 1
target framerate = 20
cache expiry delay = 5.0
pointers cache size = 40

[Map]
local map resolution = 64
local map widget size = 128
global map cell size = 4

[Shaders]
lighting method = legacy
force shaders = false
force per pixel lighting = false
auto use object normal maps = false
auto use object specular maps = false
auto use terrain normal maps = false
auto use terrain specular maps = false
soft particles = false
weather particle occlusion = false
antialias alpha test = false
adjust coverage for alpha test = false
max lights = 2
maximum light distance = 1536.0
light fade start = 0.85
light bounds multiplier = 1.0

[Shadows]
enable shadows = false

[Post Processing]
enabled = false

[Groundcover]
enabled = false

[Video]
# Top screen native resolution — no upscale, sharpest and cheapest.
resolution x = 400
resolution y = 240
antialiasing = 0
framerate limit = 30

[Water]
shader = false
refraction = false
reflection detail = 0
rain ripple detail = 0

[Fog]
use distant fog = false
radial fog = false
exponential fog = false
sky blending = false

[Game]
actors processing range = 2048

[Physics]
async num threads = 1

[Lua]
lua num threads = 0
memory limit = 16777216
lua profiler = false
gc steps per frame = 50

[General]
anisotropy = 0
# Caps texture edge size at load time. See ImageManager::getImage.
# performance: world=64,  atlas=512   (lowest memory — 3DS default)
# balanced:    world=128, atlas=768
# high:        world=256, atlas=1024
# off:         no cap (full resolution)
# Restart required to take effect.
vita texture detail = performance

[Sound]
buffer cache min = 1
buffer cache max = 4

[Stereo]
stereo enabled = false

[Windows]
